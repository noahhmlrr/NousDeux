name: Push notifications

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: push-notifications
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      COUPLE_CODE: ${{ secrets.COUPLE_CODE }}
    steps:
      - name: Check setup
        id: setup
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ] && [ -n "$COUPLE_CODE" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Add the FIREBASE_SERVICE_ACCOUNT and COUPLE_CODE Actions secrets to enable push."
          fi

      - uses: actions/checkout@v4
        if: steps.setup.outputs.ready == 'true'

      - uses: actions/setup-python@v5
        if: steps.setup.outputs.ready == 'true'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.setup.outputs.ready == 'true'
        run: python -m pip install -r requirements-push.txt

      - name: Send pending notifications
        if: steps.setup.outputs.ready == 'true'
        run: python scripts/push-notifications.py
